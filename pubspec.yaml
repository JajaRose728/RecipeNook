name: recipenook  # <-- the name of your app/package
description: "RecipeNook - recipe manager with private user spaces."  # <-- short description
publish_to: 'none'  # <-- prevent accidental publishing to pub.dev

version: 1.0.0+1  # <-- app version (1.0.0) and build number (+1)

environment:
  sdk: ^3.9.2  # <-- Dart SDK version

# -------------------- DEPENDENCIES --------------------
dependencies:
  flutter:
    sdk: flutter  # <-- this is required for any Flutter app
  google_fonts: ^6.2.0  # <-- to use Google Fonts in the app
  dotted_border: ^2.0.0  # <-- package to draw dotted borders
  cloud_firestore: ^5.4.4  # <-- Firebase Firestore for storing recipes
  firebase_core: ^3.4.1  # <-- Firebase core initialization
  firebase_auth: ^5.2.1  # <-- Firebase authentication
  supabase_flutter: ^2.5.7  # <-- Supabase for backend (optional)
  image_picker: ^1.1.2  # <-- lets users pick images from gallery/camera
  uuid: ^4.4.0  # <-- generate unique IDs for recipes
  cupertino_icons: ^1.0.8  # <-- iOS style icons

# -------------------- DEV DEPENDENCIES --------------------
dev_dependencies:
  flutter_test:
    sdk: flutter  # <-- used for testing your app
  flutter_lints: ^5.0.0  # <-- recommended lint rules
  flutter_launcher_icons: ^0.11.0  # <-- package to generate app icons

# -------------------- APP ICON SETTINGS --------------------
flutter_icons:
  android: true  # <-- generate Android icons
  ios: true      # <-- generate iOS icons
  image_path: "assets/logo.png"  # <-- path to your main app icon

# -------------------- FLUTTER SETTINGS --------------------
flutter:
  uses-material-design: true  # <-- include Material icons

  assets:
    - assets/logo.png  # <-- main app logo
    - assets/bg.jpg    # <-- background image
    - assets/whiteLogo.png  # <-- white logo variant

  fonts:  # <-- custom fonts
    - family: Cookie
      fonts:
        - asset: assets/fonts/Cookie-Regular.ttf
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
        - asset: assets/fonts/Montserrat-Italic-VariableFont_wght.ttf
